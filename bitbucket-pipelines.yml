image: php:8.4

definitions:
  steps:
    - step: &test
        name: Test
        image: php:8.4
        caches:
          - composer
          - node
        script:
          # php:8.4 already includes mbstring, xml, curl, pdo_sqlite, sqlite3.
          # zip and gd are not included; gd is required by phpoffice/phpspreadsheet.
          - apt-get update && apt-get install -y unzip git libzip-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev
          - docker-php-ext-configure gd --with-freetype --with-jpeg
          - docker-php-ext-install zip gd
          - export COMPOSER_ALLOW_SUPERUSER=1
          - export COMPOSER_CACHE_DIR="${HOME}/.composer/cache"
          - mkdir -p "$COMPOSER_CACHE_DIR"

          # Install Composer
          - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

          # Install Node 20
          - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          - apt-get install -y nodejs

          # Dist zips, not git clones. --prefer-source made this step ~12m and teardown ~7m.
          - composer install --prefer-dist --no-progress --no-interaction --no-ansi

          # Prepare environment file
          - cp .env.example .env
          - php artisan key:generate

          # Install Node dependencies
          - npm ci

          # Run Laravel tests
          - export APP_ENV=testing
          - export CACHE_STORE=array
          - export DB_CONNECTION=sqlite
          - export DB_DATABASE=":memory:"
          - export QUEUE_CONNECTION=sync
          - export SESSION_DRIVER=array
          - php artisan test

          # Build frontend assets
          - npm run build

    - step: &deploy
        name: Deploy to production
        deployment: production
        script:
          - pipe: atlassian/ssh-run:0.8.1
            variables:
              SSH_USER: $SERVER_USER
              SERVER: $SERVER_HOST
              PORT: $SERVER_PORT
              SSH_KEY: $SSH_PRIVATE_KEY
              EXTRA_ARGS: "-o ForwardAgent=no"
              COMMAND: |
                set -e
                export GIT_TERMINAL_PROMPT=0 CI=true COMPOSER_ALLOW_SUPERUSER=1
                export GIT_SSH_COMMAND="ssh -i /home/cpo_admin/.ssh/bitbucket_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
                cd /var/www/html/nebula
                echo "=== git ==="
                git fetch origin
                git reset --hard origin/master
                echo "=== composer ==="
                composer install --no-dev --prefer-dist --no-interaction --no-progress --no-ansi --optimize-autoloader
                echo "=== npm ==="
                npm ci --no-audit --no-fund
                echo "=== build ==="
                npm run build
                echo "=== artisan ==="
                php artisan migrate --force
                php artisan config:cache
                php artisan route:cache
                php artisan view:cache
                php artisan queue:restart
                echo "=== deploy done ==="

pipelines:
  branches:
    master:
      - step: *test
      - step: *deploy
